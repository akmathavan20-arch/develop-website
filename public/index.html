<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dream Learn</title>
<style>
body{margin:0;font-family:Arial;background:#0d1117;color:#e6edf3} header,section{padding:20px} .card{background:#161b22;padding:16px;border-radius:10px;margin:12px 0}
input,select,button,textarea{margin:5px 0;padding:8px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;width:100%}
button{background:#238636;cursor:pointer} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
</style></head>
<body>
<header><h1>DREAM LEARN</h1><p>Learn Towards Success</p></header>
<section class="grid">
<div class="card"><h3>Register</h3><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone"><select id="role"><option>student</option><option>faculty</option><option>admin</option></select><input id="password" type="password" placeholder="Password"><button onclick="register()">Register</button></div>
<div class="card"><h3>Login</h3><input id="lemail" placeholder="Email"><input id="lpassword" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg"></p></div>
<div class="card"><h3>AI Story</h3><input id="topic" placeholder="Topic"><input id="level" placeholder="Level"><button onclick="story()">Generate</button><p id="story"></p></div>
<div class="card"><h3>AI Quiz</h3><input id="subject" placeholder="Subject"><button onclick="quiz()">Generate</button><pre id="quiz"></pre></div>
</section>
<section class="card"><h3>Platform Features Included</h3><ul><li>Student/Faculty/Admin roles</li><li>AI Chatbot, Story, Quiz APIs</li><li>Payment status + expiry support</li><li>Course, progress, content schemas</li><li>Dark premium UI starter</li></ul></section>
<script>
let token='';
async function register(){await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,role:role.value,password:password.value})});alert('Registered');}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:lemail.value,password:lpassword.value})});const d=await r.json();token=d.token||'';loginMsg.innerText=d.name?`Logged in as ${d.name} (${d.role})`:'Login failed';}
async function story(){const r=await fetch('/api/ai/story',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({topic:topic.value,level:level.value})});story.innerText=(await r.json()).story;}
async function quiz(){const r=await fetch('/api/ai/quiz',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({subject:subject.value})});quiz.innerText=JSON.stringify(await r.json(),null,2);}
</script>
</body></html>
